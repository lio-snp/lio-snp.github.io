<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" role="img" aria-labelledby="title desc">
  <title id="title">GIFT research illustration</title>
  <desc id="desc">An LLM designs a frozen state and reward interface, then a reinforcement learning policy adapts within an evaluation window.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#152640"/><stop offset=".58" stop-color="#244365"/><stop offset="1" stop-color="#386b80"/></linearGradient>
    <linearGradient id="node" x2="1" y2="1"><stop stop-color="#95c4e0"/><stop offset="1" stop-color="#72b7c4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="640" height="282" fill="url(#night)"/>
  <circle cx="564" cy="32" r="98" fill="#5ea4a2" opacity=".17" filter="url(#glow)"/>
  <circle cx="52" cy="244" r="105" fill="#7098d5" opacity=".16" filter="url(#glow)"/>
  <g opacity=".3" stroke="#abc4d5" stroke-width=".8"><path d="M0 62h640M0 124h640M0 186h640M0 248h640M70 0v282M140 0v282M210 0v282M280 0v282M350 0v282M420 0v282M490 0v282M560 0v282"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="35" y="39" fill="#f2f6fa" font-size="15" font-weight="700" letter-spacing="3">GIFT</text>
    <text x="99" y="39" fill="#c1d6e4" font-size="10" letter-spacing=".5">LLM-GUIDED INTERFACE FOR FINANCIAL RL</text>
  </g>
  <g fill="none" stroke="#8dc0d0" stroke-width="2" opacity=".75">
    <path d="M88 134 144 96 203 121 251 86M88 134l58 44 57-57 61 42M146 178l-2-82M203 121l61 42M251 86l13 77"/>
  </g>
  <g fill="url(#node)"><circle cx="88" cy="134" r="6"/><circle cx="144" cy="96" r="6"/><circle cx="146" cy="178" r="6"/><circle cx="203" cy="121" r="7"/><circle cx="251" cy="86" r="6"/><circle cx="264" cy="163" r="7"/></g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <rect x="301" y="89" width="134" height="65" rx="10" fill="#f0f7f8" opacity=".97"/>
    <text x="368" y="116" fill="#24475b" font-size="13" font-weight="700">State + reward</text>
    <text x="368" y="136" fill="#5b798a" font-size="10">frozen interface</text>
    <rect x="477" y="89" width="122" height="65" rx="10" fill="#f0f7f8" opacity=".97"/>
    <text x="538" y="116" fill="#24475b" font-size="13" font-weight="700">RL policy</text>
    <text x="538" y="136" fill="#5b798a" font-size="10">window adaptation</text>
    <text x="184" y="212" fill="#d7e8ee" font-size="11" font-weight="700" letter-spacing="1">FINANCIAL SIGNALS</text>
    <text x="368" y="211" fill="#d7e8ee" font-size="11" font-weight="700" letter-spacing="1">DESIGN</text>
    <text x="537" y="211" fill="#d7e8ee" font-size="11" font-weight="700" letter-spacing="1">DECISION</text>
  </g>
  <g fill="none" stroke="#b9d7e0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M269 122h20m-8-7 8 7-8 7M440 122h24m-8-7 8 7-8 7"/></g>
</svg>
